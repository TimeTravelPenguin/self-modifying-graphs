[package]
name = "modifying-graphs"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20.1", features = ["2d", "bevy_dev_tools", "debug", "dynamic_linking", "ui"] }
bevy_rand = { version = "0.16.0", features = ["chacha20"] }
catppuccin = { path = "/Users/filup/Documents/Programming/Rust/catppuccin_rust", features = ["bevy"] }
log = {
  version = "0.4",
  features = [
    "max_level_debug",
    "release_max_level_warn",
  ]
}

[features]
# Default to a native dev build.
default = ["dev_native"]
dev = [
  "bevy/bevy_dev_tools",
  "bevy/bevy_ui_debug",
  "bevy/debug",
  # Improve error messages coming from Bevy
  "bevy/track_location",
]
dev_native = [
  # Improve compile times for dev builds by linking Bevy as a dynamic library.
  "bevy/dynamic_linking",
  # Enable embedded asset hot reloading for native dev builds.
  "bevy/embedded_watcher",
  # Enable asset hot reloading for native dev builds.
  "bevy/file_watcher",
  "dev",
]

[lints.clippy]
# Make sure macros use their standard braces, such as `[]` for `bevy_ecs::children!`.
nonstandard_macro_braces = "warn"
# Bevy supplies arguments to systems via dependency injection, so it's natural for systems to
# request more than 7 arguments -- which triggers this lint.
too_many_arguments = "allow"
# Queries that access many components may trigger this lint.
type_complexity = "allow"

[lints.rust]
# Mark `bevy_lint` as a valid `cfg`, as it is set when the Bevy linter runs.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(bevy_lint)"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Remove expensive debug assertions due to <https://github.com/bevyengine/bevy/issues/14291>
[profile.dev.package.wgpu-types]
debug-assertions = false

[profile.release]
lto = "thin"
codegen-units = 1

[profile.ci]
inherits = "dev"
opt-level = 0
debug = "line-tables-only"
codegen-units = 4

[profile.ci.package."*"]
opt-level = 0

[profile.web-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"
